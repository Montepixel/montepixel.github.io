<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MontePixelStudio</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 760px;
            margin: 60px auto;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            font-size: 38px;
        }

        h2 {
            margin-top: 36px;
        }

        p {
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 22px;
            background: #0f9d58;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .button:hover {
            background: #0b8043;
        }

        footer {
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }

        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <h1>MontePixelStudio</h1>

        <p>
            Independent Android app developer creating educational and utility applications.
        </p>

        <h2>Applications</h2>

        <h3>Georgia Driving Theory Test</h3>

        <p>
            Practice official-style driving theory questions for Georgia.
        </p>

        <a class="button"
           href="https://play.google.com/store/apps/details?id=com.montepixel.pddgeapp"
           target="_blank">
            Google Play
        </a>

        <h2>Support</h2>

        <p>
            Email:
            <a href="mailto:oddmotion.lab@gmail.com">
                oddmotion.lab@gmail.com
            </a>
        </p>

        <footer>
            © 2026 
        </footer>

    </div>
</div>

</body>
</html>
